name: Build & Release Polygon Strike

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🎮 Compilar Executável Windows (.exe)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar Godot 4.3 e Modelos de Exportação
        run: |
          echo "[1/4] Baixando Godot 4.3 Engine Headless..."
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          
          echo "[2/4] Baixando Export Templates do Godot 4.3..."
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          
          mkdir -p build/windows

      - name: 🔨 Exportar Jogo para Windows (.exe)
        run: |
          echo "[3/4] Exportando PolygonStrike.exe..."
          godot --headless --export-release "Windows Desktop" build/windows/PolygonStrike.exe

      - name: 📦 Compactar Executável em ZIP
        run: |
          echo "[4/4] Gerando arquivo ZIP final..."
          zip -j PolygonStrike-Windows.zip build/windows/*

      - name: 📤 Salvar Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PolygonStrike-Windows
          path: PolygonStrike-Windows.zip
          retention-days: 30

      - name: 🚀 Publicar na aba Releases do GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Polygon Strike 5v5 - Executável Pronto para Jogar (Windows)"
          body: |
            # 🎮 Polygon Strike 5v5 - Executável Windows

            Este executável foi compilado automaticamente pelo **GitHub Actions**.
            Você **não precisa ter o Godot instalado** para jogar!

            ---

            ### 🕹️ Como Jogar:
            1. Baixe o arquivo **`PolygonStrike-Windows.zip`** abaixo.
            2. Extraia o conteúdo do arquivo `.zip` em qualquer pasta do seu computador.
            3. Dê dois cliques em **`PolygonStrike.exe`** para iniciar o jogo!

            ---

            ### 🎯 Controles Rápidos:
            - **Movimentação:** `W`, `A`, `S`, `D` + `Shift` (Correr) + `Espaço` (Pular)
            - **Atirar:** `Botão Esquerdo do Mouse`
            - **Mirar (ADS):** `Botão Direito do Mouse` (Segure para zoom e precisão)
            - **Trocar de Arma:** `Roda do Mouse (Scroll)` ou teclas `1` a `5`
            - **Recarregar:** `R`
            - **Granada:** `F`
            - **Mercado da Base:** `CTRL` (Segure na base azul para comprar)
            - **Placar de Pontuação:** `TAB`
          draft: false
          prerelease: false
          files: PolygonStrike-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
